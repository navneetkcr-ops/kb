name: Validate Knowledge Base

on:
  push:
    paths:
      - '**/*.md'
  pull_request:
    paths:
      - '**/*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OKF frontmatter
        run: |
          errors=0
          checked=0
          
          while IFS= read -r -d '' file; do
            checked=$((checked + 1))
            
            # Check for frontmatter opening
            if ! head -1 "$file" | grep -q '^---'; then
              echo "::error file=$file::Missing YAML frontmatter"
              errors=$((errors + 1))
              continue
            fi
            
            # Check for 'type' field in frontmatter
            frontmatter=$(sed -n '1,/^---$/p' "$file" | tail -n +2)
            if ! echo "$frontmatter" | grep -q '^type:'; then
              echo "::error file=$file::Missing required 'type' field in frontmatter"
              errors=$((errors + 1))
            fi
            
          done < <(find . -name '*.md' \
            -not -path './.templates/*' \
            -not -path './.meta/*' \
            -not -path './.github/*' \
            -not -path './.obsidian/*' \
            -not -path './.agents/*' \
            -not -name 'README.md' \
            -not -name 'AGENTS.md' \
            -not -name 'GEMINI.md' \
            -print0)
          
          echo ""
          echo "Checked $checked files"
          if [ $errors -gt 0 ]; then
            echo "::error::Found $errors validation error(s)"
            exit 1
          fi
          echo "All files have valid OKF frontmatter"

      - name: Check for stale content
        run: |
          today=$(date +%Y-%m-%d)
          stale=0
          
          grep -rl 'stale_after:' --include='*.md' . 2>/dev/null | while read -r file; do
            stale_date=$(grep 'stale_after:' "$file" | head -1 | awk '{print $2}')
            if [ -n "$stale_date" ] && [[ "$stale_date" < "$today" ]]; then
              echo "::warning file=$file::Content is stale (since $stale_date)"
              stale=$((stale + 1))
            fi
          done
          
          echo "Stale content check complete"